name: Check and Update Razer Chroma Runtime

on:
  schedule:
    # Run every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force re-download and verification of Chroma runtime installer'
        required: false
        default: false
        type: boolean

jobs:
  check-chroma-runtime:
    name: Check & Sync Razer Chroma Runtime
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Chroma Runtime Sync Script
        shell: pwsh
        env:
          FORCE_CHROMA_UPDATE: ${{ github.event.inputs.force_update && '1' || '0' }}
        run: |
          python tools/chroma-runtime/sync_runtime.py

      - name: Check for Changes
        id: git-diff
        shell: pwsh
        run: |
          $diff = git status --porcelain tools/chroma-runtime
          if ($diff) {
            Write-Host "Chroma runtime changes detected:"
            Write-Host $diff
            echo "has_changes=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "No changes detected. Bundled Razer Chroma runtime is up to date."
            echo "has_changes=false" >> $env:GITHUB_OUTPUT
          }

      - name: Package Updated Standalone Archive
        if: steps.git-diff.outputs.has_changes == 'true'
        shell: pwsh
        run: |
          Compress-Archive -Path tools/chroma-runtime/* -DestinationPath razer-chroma-runtime-standalone.zip -Force

      - name: Commit and Push Updated Runtime
        if: steps.git-diff.outputs.has_changes == 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tools/chroma-runtime/
          git commit -m "ci(chroma): update bundled Razer Chroma SDK runtime binaries"
          git push origin main
