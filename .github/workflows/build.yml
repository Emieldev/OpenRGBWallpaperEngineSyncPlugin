name: Build Multi-Platform OpenRGB Plugin

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  # ==========================================
  # Windows x64 Build
  # ==========================================
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          arch: win64_msvc2022_64

      - name: Build Plugin with CMake
        run: |
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Package Zipped Release Assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path build/OpenRGBWallpaperEngineSyncPlugin.dll, README.md, LICENSE -DestinationPath dist/OpenRGBWallpaperEngineSyncPlugin-windows-x64.zip -Force
          Compress-Archive -Path tools/chroma-runtime/* -DestinationPath dist/razer-chroma-runtime-standalone.zip -Force

      - name: Upload Windows Zipped Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenRGBWallpaperEngineSyncPlugin-windows-x64
          path: dist/*.zip

  # ==========================================
  # Linux Native (amd64 / x86_64)
  # ==========================================
  build-linux-x86_64:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qt6-base-dev qt6-base-dev-tools libgl1-mesa-dev build-essential cmake zip

      - name: Build Plugin
        run: |
          cmake -B build_linux_x64 -DCMAKE_BUILD_TYPE=Release
          cmake --build build_linux_x64

      - name: Package Zipped Release Asset
        run: |
          mkdir -p dist
          cp build_linux_x64/OpenRGBWallpaperEngineSyncPlugin.so dist/
          zip -j dist/OpenRGBWallpaperEngineSyncPlugin-linux-x86_64.zip dist/OpenRGBWallpaperEngineSyncPlugin.so README.md LICENSE

      - name: Upload Linux x86_64 Zipped Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenRGBWallpaperEngineSyncPlugin-linux-x86_64
          path: dist/OpenRGBWallpaperEngineSyncPlugin-linux-x86_64.zip

  # ==========================================
  # Linux Multi-Arch (arm64, armhf, i386)
  # ==========================================
  build-linux-multiarch:
    runs-on: ubuntu-22.04
    continue-on-error: true
    strategy:
      matrix:
        arch: [aarch64, armv7l, i386]
        include:
          - arch: aarch64
            distro: bullseye
          - arch: armv7l
            distro: bullseye
          - arch: i386
            distro: bullseye
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run build in multi-arch container
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: ${{ matrix.arch }}
          distro: ${{ matrix.distro }}
          githubToken: ${{ github.token }}
          install: |
            apt-get update -q -y
            apt-get install -q -y build-essential cmake qtbase5-dev qtbase5-dev-tools
          run: |
            cmake -B build_${{ matrix.arch }} -DCMAKE_BUILD_TYPE=Release
            cmake --build build_${{ matrix.arch }}
            mkdir -p dist
            cp build_${{ matrix.arch }}/*OpenRGBWallpaperEngineSyncPlugin.so dist/OpenRGBWallpaperEngineSyncPlugin-linux-${{ matrix.arch }}.so

      - name: Package Zipped Release Asset
        run: |
          sudo apt-get update && sudo apt-get install -y zip
          zip -j dist/OpenRGBWallpaperEngineSyncPlugin-linux-${{ matrix.arch }}.zip dist/OpenRGBWallpaperEngineSyncPlugin-linux-${{ matrix.arch }}.so README.md LICENSE

      - name: Upload Multi-Arch Zipped Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenRGBWallpaperEngineSyncPlugin-linux-${{ matrix.arch }}
          path: dist/OpenRGBWallpaperEngineSyncPlugin-linux-${{ matrix.arch }}.zip

  # ==========================================
  # Publish GitHub Release with Zipped Assets
  # ==========================================
  release:
    name: Publish Release Assets
    needs: [build-windows, build-linux-x86_64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all zipped artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_zips
          merge-multiple: true

      - name: List Release Assets
        run: ls -la release_zips/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_zips/*.zip
          name: "OpenRGB Wallpaper Engine Sync Plugin ${{ github.ref_name }}"
          generate_release_notes: false
          body: |
            ## OpenRGB Wallpaper Engine Sync Plugin ${{ github.ref_name }}

            A high-performance companion plugin for **OpenRGB** that synchronizes your PC case lighting with **Wallpaper Engine** using Wallpaper Engine's native **Razer Chroma / Corsair iCUE** output stream.

            * **Zero File Tampering**: No DLL injection, memory hooking, or modified Steam files.
            * **Ultra-Low Workload**: `< 0.1% CPU`, `0% GPU`, completely flat RAM usage.
            * **Hardware Safe**: Adaptive bus pacing protects motherboard and GPU I²C / SMBus controllers from bus congestion and LED flicker.
            * **Diffuser Bleed Correction**: Perceptual gamma (~2.1) and white-floor cancellation eliminate washed-out whites/pinks on frosted silicone diffusers.

            ---

            ### 📦 Release Downloads

            | Platform / Package | Description |
            | :--- | :--- |
            | **[OpenRGBWallpaperEngineSyncPlugin-windows-x64.zip](https://github.com/Emieldev/OpenRGBWallpaperEngineSyncPlugin/releases/download/${{ github.ref_name }}/OpenRGBWallpaperEngineSyncPlugin-windows-x64.zip)** | **Windows 64-bit** plugin DLL (`.dll`) + docs |
            | **[OpenRGBWallpaperEngineSyncPlugin-linux-x86_64.zip](https://github.com/Emieldev/OpenRGBWallpaperEngineSyncPlugin/releases/download/${{ github.ref_name }}/OpenRGBWallpaperEngineSyncPlugin-linux-x86_64.zip)** | **Linux x86_64** shared library (`.so`) + docs |
            | **[razer-chroma-runtime-standalone.zip](https://github.com/Emieldev/OpenRGBWallpaperEngineSyncPlugin/releases/download/${{ github.ref_name }}/razer-chroma-runtime-standalone.zip)** | **Standalone Chroma Runtime** (zero Razer hardware or Synapse needed) |

            ---

            ### 🪟 Windows Installation Instructions

            #### Step 1: Install Chroma Runtime
            Wallpaper Engine streams lighting data through the Razer Chroma SDK. You **do not** need any Razer hardware.
            * **Recommended (Zero Bloat)**: Download **`razer-chroma-runtime-standalone.zip`**, extract the folder, right-click `install.bat`, and select **Run as administrator**.
            * *Alternative*: If you already use Razer peripherals, install [Razer Synapse 4](https://www.razer.com/synapse-4) with the **Chroma Connect** module enabled.

            #### Step 2: Enable Plugin in Wallpaper Engine
            1. Open **Wallpaper Engine**.
            2. Click the gear icon (**Settings**) in the top right.
            3. Open the **Plugins** tab.
            4. Ensure **iCUE & Chroma SDK** is checked / enabled.

            #### Step 3: Install Plugin into OpenRGB
            1. Download **`OpenRGBWallpaperEngineSyncPlugin-windows-x64.zip`** and extract `OpenRGBWallpaperEngineSyncPlugin.dll`.
            2. Copy `OpenRGBWallpaperEngineSyncPlugin.dll` to your OpenRGB plugins directory:
               ```
               %APPDATA%\OpenRGB\plugins\OpenRGBWallpaperEngineSyncPlugin.dll
               ```
               *(Press `Win + R`, paste `%APPDATA%\OpenRGB\plugins`, press Enter. Create the `plugins` folder if it does not exist).*
            3. Launch **OpenRGB as Administrator** (required for low-level motherboard and GPU I²C/SMBus communication).
            4. Go to the **Wallpaper Engine** tab in OpenRGB.
            5. Select your desired devices and check **Enable Wallpaper Engine Lighting Sync**.

            ---

            ### 🐧 Linux Installation Instructions

            #### Step 1: Enable Chroma SDK in Wallpaper Engine / linux-wallpaperengine
            * If running Wallpaper Engine via Steam Proton or [linux-wallpaperengine](https://github.com/Almamu/linux-wallpaperengine), enable Razer Chroma / iCUE lighting output.

            #### Step 2: Install Plugin into OpenRGB
            1. Download **`OpenRGBWallpaperEngineSyncPlugin-linux-x86_64.zip`** and extract `OpenRGBWallpaperEngineSyncPlugin.so`.
            2. Copy the library to your OpenRGB plugins directory:
               ```bash
               mkdir -p ~/.config/OpenRGB/plugins
               cp OpenRGBWallpaperEngineSyncPlugin.so ~/.config/OpenRGB/plugins/
               ```
            3. Restart **OpenRGB**.
            4. In the **Wallpaper Engine** tab, enable sync and select your lighting devices.

            ---

            ### ⚠️ Dynamic Wallpaper Advisory
            This plugin is designed for **ambient, atmospheric, and scenic wallpapers** (nature, landscapes, aesthetic art, cinematic video loops).
            **Fast rainbow color-cycling backgrounds (e.g. *Razer Bedroom*) are not recommended**, because physical PC case buses (I²C on GPUs, SMBus on RAM) cannot sustain 30 Hz multi-color strobing without hardware bus saturation or LED flickering.
